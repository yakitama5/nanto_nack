name: slides
description: "NantoNack プレゼンスライド (flutter_deck)"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  cupertino_icons: ^1.0.8
  flutter:
    sdk: flutter
  flutter_deck: ^0.29.0
  # プレゼンター表示（別タブ）とスライド本体の同期に使う。
  #
  # 本体と別タブは localStorage の storage イベントでやり取りするため、
  # **同一オリジンで配信されている必要がある**。file:// では動かない。
  # このクライアントを FlutterDeckApp に渡さないと、ツールバーに
  # 「Open presenter view」ボタン自体が出ない（`available` が false になる）。
  flutter_deck_web_client: ^0.4.0
  flutter_riverpod: ^2.6.1
  # 本文フォント Kiwi Maru を実行時に取得する。
  #
  # **フォントファイルは同梱していない。** そのため表示には
  # fonts.gstatic.com への通信が要る。取得に失敗した場合は無言で
  # quiz_core の NotoSansJP にフォールバックする（エラーは出ない）。
  # オフライン投影で字形を確実に揃えたくなったら、TTF を assets に置いて
  # `fonts:` 宣言に切り替えること。
  google_fonts: ^6.2.1
  # QR は画像を持たずコードから描く。投影で拡大しても粗くならないため。
  qr_flutter: ^4.1.0
  quiz_core:
    path: ../../packages/quiz_core
  shopping:
    path: ../../packages/quizzes/shopping

dev_dependencies:
  altive_lints: ^2.2.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    # マスコット「ナントム」。UI 本体は shopping / quiz_core から直接描画するため、
    # ここにコピーするのはパッケージ外にある画像だけでよい。
    - assets/images/
