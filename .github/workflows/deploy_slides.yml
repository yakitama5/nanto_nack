name: Build Slides

# main のスライド関連の変更で自動ビルドし、2つの成果物を出す。
#
#   1. Artifact `nanto-nack-slides` … 発表本番用。ダウンロードしてローカルで配信する
#   2. GitHub Pages                  … 共有・見返し用
#
# 本番の投影は 1 を使う。バンドルが大きく、会場の回線に依存させたくないため。
#
# apps/slides は path 依存で quiz_core / shopping の UI を**実描画**しているため、
# それらが変わるとスライドの見た目も変わる。paths に含めていないと
# 「最新の UI を反映していない成果物が残り続ける」ことに気づけないので、
# 依存元も対象に入れている。
on:
  push:
    branches: [main]
    paths:
      - 'apps/slides/**'
      - 'packages/quiz_core/**'
      - 'packages/quizzes/shopping/**'
      - '.github/workflows/deploy_slides.yml'
  workflow_dispatch:

# 既定は読み取りのみ。公開に必要な権限は deploy ジョブだけに与える。
permissions:
  contents: read

# Pages のデプロイは途中で打ち切ると公開が中途半端な状態になりうるため、
# cancel-in-progress は false にする（GitHub 公式のスターターと同じ）。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: スライドのビルド
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Flutter バージョンの取得 (.fvmrc)
        id: fvm
        run: echo "version=$(jq -r '.flutter' .fvmrc)" >> $GITHUB_OUTPUT

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm.outputs.version }}
          cache: true

      - name: Pub キャッシュの復元
        uses: actions/cache@v6
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: pub-${{ runner.os }}-

      # スライド自身は Firebase を使わないが、shopping → system の依存があり、
      # dart2js は**呼ばれないコードも含めてライブラリ全体をコンパイルする**。
      # firebase_options*.dart は .gitignore されているので復元が要る。
      # （Android/iOS 用の google-services.json 等は Web ビルドでは不要）
      - name: Firebase 設定ファイルの復元
        run: |
          mkdir -p packages/system/lib/src/firebase
          echo "${{ secrets.FIREBASE_OPTIONS_DART_BASE64 }}" | base64 -d > packages/system/lib/src/firebase/firebase_options.dart
          echo "${{ secrets.FIREBASE_OPTIONS_DEV_DART_BASE64 }}" | base64 -d > packages/system/lib/src/firebase/firebase_options_dev.dart

      # apps/slides はワークスペース外の独立パッケージなので melos は不要。
      # このディレクトリで pub get すれば path 依存の quiz_core / shopping も解決される。
      # 生成コード（*.g.dart）はコミットされているため gen:all は不要。
      # env.g.dart 系だけは .gitignore されているが、app_main 配下のみで
      # スライドの依存グラフには含まれない。
      - name: 依存関係の解決
        run: cd apps/slides && flutter pub get

      # base-href は配信場所ごとに変わり、**1つの成果物を使い回せない**。
      # 値が合わないとアセットが全て 404 になるため、2 回ビルドする。
      #   ローカル配信 (http://localhost:8000/) → /
      #   Pages        (…/nanto_nack/)          → /nanto_nack/
      - name: ローカル配信用のビルド (base-href /)
        run: |
          cd apps/slides
          flutter build web --base-href /
          mv build/web build/web-local

      - name: 発表本番用 Artifact のアップロード
        uses: actions/upload-artifact@v4
        with:
          name: nanto-nack-slides
          path: apps/slides/build/web-local
          if-no-files-found: error
          retention-days: 90

      - name: GitHub Pages 用のビルド (base-href /nanto_nack/)
        run: cd apps/slides && flutter build web --base-href /nanto_nack/

      # actions/configure-pages は使わない。base-href を決め打ちしており
      # 出力（base_url 等）が不要なうえ、Pages API を読むため build ジョブに
      # pages 権限が必要になってしまうため。
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/slides/build/web

  # ビルドが失敗すればこのジョブは走らないので、
  # 壊れたものが公開されることはない（公開済みの内容もそのまま残る）。
  deploy:
    name: GitHub Pages への公開
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
